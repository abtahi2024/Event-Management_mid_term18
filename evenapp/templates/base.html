<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Event Management{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-white text-gray-800">
    <nav class="bg-gradient-to-r from-[#0f172a] to-[#334155] text-white">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
          <!-- Left: Logo -->
          <div class="flex-shrink-0">
            <h1
              class="text-2xl font-bold bg-gradient-to-r from-pink-500 to-indigo-600 bg-clip-text text-transparent"
            >
              Event Management
            </h1>
          </div>

          <!-- Center: Links (desktop only) -->
          <div class="hidden md:flex space-x-6">
            <a
              href="{% url 'deshboard' %}"
              class="cursor-pointer transition-all bg-blue-500 text-white px-4 py-2 rounded-md border-blue-600 border-b-[4px] hover:brightness-110 hover:-translate-y-[1px] hover:border-b-[6px] active:border-b-[2px] active:brightness-90 active:translate-y-[2px]"
              >Dashboard</a
            >
            <a
              href="{% url 'create-event' %}"
              class="cursor-pointer transition-all bg-blue-500 text-white px-4 py-2 rounded-md border-blue-600 border-b-[4px] hover:brightness-110 hover:-translate-y-[1px] hover:border-b-[6px] active:border-b-[2px] active:brightness-90 active:translate-y-[2px]"
              >Add Event</a
            >
            <a href="{% url 'add-category' %}" class="cursor-pointer transition-all bg-blue-500 text-white px-4 py-2 rounded-md border-blue-600 border-b-[4px] hover:brightness-110 hover:-translate-y-[1px] hover:border-b-[6px] active:border-b-[2px] active:brightness-90 active:translate-y-[2px]"
              >Add Category</a
            >
          </div>

          <!-- Right: User dropdown -->
          <div class="relative">
            <button
              id="user-menu-button"
              class="flex items-center space-x-2 focus:outline-none"
            >
              <img
                class="h-8 w-8 rounded-full object-cover"
                src="https://placekitten.com/100/100"
                alt="User avatar"
              />
            </button>
            <div
              id="user-menu"
              class="absolute right-0 mt-2 w-48 bg-white text-gray-800 rounded-md shadow-lg py-1 hidden z-50"
            >
              <a
                href="{% url 'profile' %}"
                class="block px-4 py-2 text-sm hover:bg-gray-100"
                >My Profile</a
              >
              <form method="post" action="{% url 'sign-out' %}">
                {% csrf_token %}
                <button
                  type="submit"
                  class="w-full text-left px-4 py-2 text-sm hover:bg-gray-100"
                >
                  Logout
                </button>
              </form>
            </div>
          </div>

          <!-- Hamburger (mobile) -->
          <div class="md:hidden">
            <button id="menu-toggle" class="focus:outline-none">
              <svg
                class="h-6 w-6 text-white"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 6h16M4 12h16M4 18h16"
                />
              </svg>
            </button>
          </div>
        </div>

        <!-- Mobile Menu -->
        <div id="mobile-menu" class="md:hidden hidden space-y-2 py-4">
          <a
            href="{% url 'deshboard' %}"
            class="block text-white hover:underline"
            >Dashboard</a
          >
          <a
            href="{% url 'create-event' %}"
            class="block text-white hover:underline"
            >Add Event</a
          >
          <a
            href="{% url 'add-category' %}"
            class="block text-white hover:underline"
            >Add Category</a
          >
        </div>
      </div>
    </nav>

    <main class="max-w-6xl mx-auto py-8 px-4">
      {% if messages %}
      <div class="mb-4">
        {% for message in messages %}
        <div
          class="bg-green-100 border-l-4 border-green-500 text-green-700 p-4 rounded mb-2"
          role="alert"
        >
          {{ message }}
        </div>
        {% endfor %}
      </div>
      {% endif %} {% block content %}{% endblock content %}
    </main>

    <script>
      const userBtn = document.getElementById("user-menu-button");
      const userMenu = document.getElementById("user-menu");
      userBtn.addEventListener("click", () => {
        userMenu.classList.toggle("hidden");
      });

      const menuToggle = document.getElementById("menu-toggle");
      const mobileMenu = document.getElementById("mobile-menu");
      menuToggle.addEventListener("click", () => {
        mobileMenu.classList.toggle("hidden");
      });
    </script>
  </body>
</html>
