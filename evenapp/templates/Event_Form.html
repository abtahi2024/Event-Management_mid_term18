{% extends 'base.html' %}
{% block title %}Create or Update Event{% endblock %}

{% block content %}
<h2 class="text-4xl font-bold mb-6 text-center bg-gradient-to-br from-pink-500  to-purple-500 bg-clip-text text-transparent">Event Form</h2>

<form method="POST" class="bg-gradient-to-b from-pink-300 via-purple-300 to-rose-300 p-6 rounded shadow-md space-y-4" enctype='multipart/form-data'>
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit"class="text-white bg-gradient-to-r from-pink-500 via-pink-600 to-pink-700 hover:bg-gradient-to-br focus:ring-4 focus:outline-none focus:ring-pink-300 dark:focus:ring-pink-800 shadow-lg shadow-pink-500/50 dark:shadow-lg dark:shadow-pink-800/80 font-medium rounded-lg text-sm px-5 py-2.5 text-center mr-2 mb-2">
    Save Event
  </button>
</form>
{% endblock %}
