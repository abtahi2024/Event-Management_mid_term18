{% extends "base.html" %}
{% block content %}
<div class="container mx-auto px-6 py-10">
  <h2 class="text-3xl font-extrabold text-center mb-10 text-gray-800">
    🌟 All Events 🌟
  </h2>

  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
    {% for event in events %}
      <div class="relative group bg-gradient-to-br from-purple-500 to-pink-500 text-white rounded-2xl shadow-xl p-6 transform transition duration-500 hover:rotate-1 hover:-translate-y-3 hover:shadow-2xl">
        <div class="absolute inset-0 bg-gradient-to-r from-pink-400 to-purple-600 rounded-2xl blur opacity-50 group-hover:opacity-75 transition"></div>
        
        <div class="relative z-10">
          <h3 class="text-xl font-bold mb-3">{{ event.name }}</h3>
          <p class="text-sm text-gray-100 mb-5">
            {{ event.description|default:"No description available."|truncatechars:80 }}
          </p>
          <a href="{% url 'event-details' event.id %}" 
             class="inline-block px-5 py-2 bg-white text-purple-600 font-semibold rounded-full shadow-md hover:scale-105 transition">
            View Details →
          </a>
        </div>
      </div>
    {% empty %}
      <p class="col-span-full text-center text-gray-600 text-lg">No events available</p>
    {% endfor %}
  </div>
</div>
{% endblock content %}
