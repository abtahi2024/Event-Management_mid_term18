{% extends 'base.html' %} 
{% block title %}DeleteParticipant{% endblock %} {%
block content %}

<h2>
  Are you sure you want to remove {{ user.username }} from "{{ event.name }}"?
</h2>

<form method="post">
  {% csrf_token %}
  <button type="submit">Yes, Remove</button>
  <a href="{% url 'event-details' event.id %}">Cancel</a>
</form>

{% endblock content %}
