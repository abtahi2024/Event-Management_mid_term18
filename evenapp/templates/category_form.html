{% extends 'base.html' %}
{% block title %}Add Category{% endblock %}

{% block content %}
<h2 class="text-2xl font-bold mb-6">Add New Category</h2>

<form method="POST" class="bg-[conic-gradient(at_bottom_right,_var(--tw-gradient-stops))] from-[#1d4ed8] via-[#1e40af] to-[#111827] p-8 rounded shadow-md space-y-4">
  {% csrf_token %}
  {{ form.as_p }}
  <button 
    type="submit"
    class="bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-600 hover:to-pink-600 text-white font-semibold py-3 px-6 rounded-full shadow-lg transform hover:scale-105 transition duration-300 ease-in-out"
  >
    Add Category
  </button>
</form>
{% endblock content %}
