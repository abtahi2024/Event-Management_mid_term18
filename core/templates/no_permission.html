<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <title>No Permission</title>
        <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1646/1646646.png" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div class="bg-gray-100 p-8 rounded shadow-lg text-center max-w-md w-full" data-aos="flip-left">
        <img src="https://cdn-icons-png.flaticon.com/512/2748/2748558.png" alt="No Access" class="w-24 h-24 mx-auto mb-4">
        <h1 class="text-3xl font-bold text-red-600 mb-4">No Permission!</h1>
        <p class="text-gray-700 mb-6">You do not have permission to view this page. Please loging the account.</p>
        
        <a href="{% url 'sign-in' %}">
            <button class="bg-rose-500 hover:bg-blue-300 text-white font-semibold py-2 px-6 rounded transition duration-200">
                Go to Login
            </button>
        </a>
    </div>
  <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
  <script>
    AOS.init();
  </script>
</body>
</html>
