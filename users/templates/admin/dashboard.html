<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <header class="">
      <nav class="bg-gradient-to-r from-[#0f172a] to-[#334155] text-white">
        <div class="flex justify-between items-center h-16">
          <a href="index.html" class="text-xl font-bold text-gray-800 ">
            <h1 class="text-2xl font-bold bg-gradient-to-r from-pink-500 to-indigo-600 bg-clip-text text-transparent">Event Management</h1>
          </a>
          <div class="hidden md:flex space-x-4">
            <a
              href="{% url 'deshboard' %}"
              class="cursor-pointer transition-all bg-blue-500 text-white px-4 py-2 rounded-md border-blue-600 border-b-[4px] hover:brightness-110 hover:-translate-y-[1px] hover:border-b-[6px] active:border-b-[2px] active:brightness-90 active:translate-y-[2px]"
              >Dashboard</a
            >
            {% comment %} <a href="#" class="text-gray-600 hover:text-gray-800">Tasks</a> {% endcomment %}
            <a href="{% url 'group-list' %}" class="cursor-pointer transition-all bg-blue-500 text-white px-4 py-2 rounded-md border-blue-600 border-b-[4px] hover:brightness-110 hover:-translate-y-[1px] hover:border-b-[6px] active:border-b-[2px] active:brightness-90 active:translate-y-[2px]"
              >Groups</a
            >
            <a
              href="{% url 'create-group' %}"
              class="cursor-pointer transition-all bg-blue-500 text-white px-4 py-2 rounded-md border-blue-600 border-b-[4px] hover:brightness-110 hover:-translate-y-[1px] hover:border-b-[6px] active:border-b-[2px] active:brightness-90 active:translate-y-[2px]"
              >Create Group</a
            >
          </div>
          <div class="flex items-center">
            <div class="relative">
              <button
                id="user-menu-button"
                class="flex items-center focus:outline-none"
              >
                <img
                  class="h-8 w-8 rounded-full object-cover"
                  src="https://placekitten.com/100/100"
                  alt="User avatar"
                />
              </button>
              <div
                id="user-menu"
                class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 hidden"
              >
                <a
                  href="{% url 'admin-dashboard' %}"
                  class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100"
                  >Dashboard</a
                >
                <form method="post" action="{% url 'sign-out' %}">
                  {% csrf_token %}
                  <button
                    type="submit"
                    class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100"
                  >
                    Logout
                  </button>
                </form>
              </div>
            </div>
            <div class="md:hidden ml-4">
              <button
                id="menu-toggle"
                class="text-gray-600 hover:text-gray-800 focus:outline-none"
              >
                <svg
                  class="h-6 w-6"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M4 6h16M4 12h16m-7 6h7"
                  ></path>
                </svg>
              </button>
            </div>
          </div>
        </div>
        <div id="mobile-menu" class="md:hidden hidden mt-4">
          <a href="#" class="block py-2 text-gray-600 hover:text-gray-800"
            >Dashboard</a
          >
          <a href="#" class="block py-2 text-gray-600 hover:text-gray-800"
            >Event</a
          >
          <a href="{% url 'group-list' %}" class="block py-2 text-gray-600 hover:text-gray-800"
            >Groups</a
          >
          <a href="#" class="block py-2 text-gray-600 hover:text-gray-800"
            >Create Group</a
          >
        </div>
      </nav>
    </header>

    <main>
      <div class="container mx-auto px-6 py-4">
       {% block content %}
       {% include "admin/user_list.html" %}
       {% endblock content %}
      </div>
    </main>

    <script>
      document
        .getElementById("menu-toggle")
        .addEventListener("click", function () {
          document.getElementById("mobile-menu").classList.toggle("hidden");
        });

      document
        .getElementById("user-menu-button")
        .addEventListener("click", function () {
          document.getElementById("user-menu").classList.toggle("hidden");
        });

      // Close the dropdown when clicking outside
      window.addEventListener("click", function (e) {
        if (!document.getElementById("user-menu-button").contains(e.target)) {
          document.getElementById("user-menu").classList.add("hidden");
        }
      });
    </script>
  </body>
</html>
