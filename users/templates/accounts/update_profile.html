{% extends "base.html" %}
{% block content %}
    <div class='mx-auto w-1/2 my-9 border-2 p-5 shadow-lg bg-gradient-to-r from-pink-400 via-orange-200 to-purple-400'>
        {% if messages %}
            {% for message in messages %}
                <div class="px-2 py-1 {% if message.tags == 'success' %}bg-green-500{% endif %} ">{{message}}</div>
            {% endfor %}
        {% endif %}
        <form method='POST' enctype='multipart/form-data'>
            {% csrf_token %}
            {{ form }}
            <button class='bg-blue-500 px-2 py-1 rounded text-white mt-3' type="submit">Update Profile</button>
        </form>
    </div>
{% endblock content %}
