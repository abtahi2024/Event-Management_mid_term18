<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Login</title>
    <style>
      p label{
        font-size:1.25rem
      }
    </style>
  </head>
  <body class="bg-white min-h-screen flex items-center justify-center px-4">
    <div class="bg-gradient-to-r from-blue-300 via-rose-300 to-pink-300 p-8 rounded-2xl shadow-2xl w-full max-w-md">
      <h1 class="text-3xl font-bold text-center text- mb-6">Registation</h1>

      {% if messages %}
        {% for message in messages %}
          <div class="bg-green-200 text-white px-4 py-2 rounded-lg border border-green-300 mb-4 text-sm">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}

      <form method="POST" class="space-y-5">
        {% csrf_token %}

        {{ form.as_p }}

        <div class="flex flex-col sm:flex-row sm:justify-between gap-4 pt-2">
          <!-- Login Button -->
          <button
            type="submit"
            class="w-full sm:w-1/2 bg-sky-500 hover:bg-red-700 text-white font-medium py-2 rounded-lg transition duration-200">
            Sign In
          </button>
        </div>
      </form>
    </div>
  </body>
</html>
